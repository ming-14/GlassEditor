name: Release

# 推送 v* 形式的标签（如 v1.0、v1.2.3）时触发，自动打包并发布
on:
  push:
    tags:
      - "v*"

# 创建 Release 需要写权限
permissions:
  contents: write

jobs:
  build-release:
    name: 打包并发布
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # 以 app.py 为入口打包为 onedir 目录（启动速度优于 onefile）
      # --collect-all 确保 qfluentwidgets 的 Qt 资源和 pygments 的动态词法分析器被完整收集
      - name: 使用 PyInstaller 打包
        run: pyinstaller --noconfirm --clean --windowed --name GlassEditor --collect-all qfluentwidgets --collect-all pygments app.py

      - name: 压缩产物
        run: Compress-Archive -Path dist/GlassEditor/* -DestinationPath "GlassEditor-${{ github.ref_name }}-windows-x64.zip"

      - name: 创建 Release 并上传安装包
        uses: softprops/action-gh-release@v2
        with:
          name: 琉璃编辑器 ${{ github.ref_name }}
          files: GlassEditor-${{ github.ref_name }}-windows-x64.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
