[project]
name = "GlassEditor"
version = "1.0.0"
description = "琉璃编辑器 - 轻量级文本编辑器"
requires-python = ">=3.11"

dependencies = [
    "PyQt5>=5.15",
    "PyQt-Fluent-Widgets>=1.7",
    "loguru>=0.7",
    "pygments>=2.17",
    "chardet>=5.0",
    "atomicwrites>=1.4",
    "pydantic-settings>=2.0",
    "click>=8.1",
]

[project.scripts]
glasseditor = "src.main:main"
